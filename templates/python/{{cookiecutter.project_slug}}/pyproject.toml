[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "{{ cookiecutter.project_slug }}"
version = "0.1.0"
description = "{{ cookiecutter.project_description }}"
readme = "README.md"
requires-python = ">={{ cookiecutter.python_version }}"
authors = [
    { name = "{{ cookiecutter.author_name }}", email = "{{ cookiecutter.author_email }}" }
]
keywords = ["python", "{{ cookiecutter.project_slug }}"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: {{ cookiecutter.python_version }}",
    "Operating System :: OS Independent",
]
dependencies = [
{% if cookiecutter.project_type == "CLI Application" -%}
{% if cookiecutter.cli_framework == "typer" -%}
    "typer>=0.9.0",
    "rich>=13.0.0",
{% elif cookiecutter.cli_framework == "click" -%}
    "click>=8.1.0",
{% endif -%}
{% endif -%}
]

{% if cookiecutter.project_type == "CLI Application" -%}
[project.scripts]
{{ cookiecutter.project_slug }} = "{{ cookiecutter.project_slug }}.cli:main"

{% endif -%}

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "build>=1.2.0",
]
{% if cookiecutter.add_docs == "yes" -%}
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.5.0",
]
{% endif -%}

[tool.hatch.build.targets.wheel]
packages = ["src/{{ cookiecutter.project_slug }}"]

[tool.ruff]
line-length = 88
target-version = "py{{ cookiecutter.python_version.replace('.', '') }}"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["{{ cookiecutter.project_slug }}"]

[tool.mypy]
python_version = "{{ cookiecutter.python_version }}"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov={{ cookiecutter.project_slug }} --cov-report=term-missing"
pythonpath = ["src"]
